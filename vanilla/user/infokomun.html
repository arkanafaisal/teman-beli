<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TemanBeli - Info & Direktori Komunitas</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: { 50: "#eff6ff", 100: "#dbeafe", 500: "#3b82f6", 600: "#2563eb", 700: "#1d4ed8" },
            },
          },
        },
      };
    </script>

    <style>
      #main-header {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      /* Hide scrollbar for category filter slider */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-300 flex flex-col justify-between selection:bg-blue-500 selection:text-white">
    <!-- Floating Sticky Header / Navbar Wrapper -->
    <div class="sticky top-0 z-50 w-full transition-all duration-300 px-4 sm:px-6 md:px-8 pt-4 sm:pt-5" id="header-wrapper">
      <header id="main-header" class="max-w-6xl mx-auto px-5 sm:px-8 h-16 flex items-center justify-between bg-white/85 dark:bg-slate-900/85 backdrop-blur-md border border-slate-200/80 dark:border-slate-800/80 rounded-2xl shadow-sm">
        <!-- Brand Logo -->
        <a href="index.html" class="flex items-center gap-2 font-extrabold text-lg sm:text-xl tracking-tight text-blue-600 dark:text-blue-400">
          <span class="p-1.5 bg-blue-100 dark:bg-blue-950/80 rounded-xl text-base sm:text-lg">🎓</span>
          <span>Patungan<span class="text-slate-900 dark:text-white">Aja!</span></span>
        </a>

        <!-- Desktop Navigation Links -->
        <nav class="hidden md:flex items-center gap-6 lg:gap-8 text-sm font-medium text-slate-600 dark:text-slate-300">
          <a href="index.html" class="hover:text-blue-600 dark:hover:text-blue-400 transition">Beranda</a>
          <a href="eksplor.html" class="hover:text-blue-600 dark:hover:text-blue-400 transition">Eksplor</a>
          <!-- <a href="riwayat.html" class="hover:text-blue-600 dark:hover:text-blue-400 transition">Riwayat</a> -->
          <a href="infokomun.html" class="text-blue-600 dark:text-blue-400 transition">Komunitas</a>
          <a href="profil.html" class="hover:text-blue-600 dark:hover:text-blue-400 transition">Profil</a>
        </nav>

        <!-- Action Buttons -->
        <div class="flex items-center gap-2 sm:gap-3">
          <!-- Dark Mode Toggle -->
          <button onclick="toggleTheme()" class="p-2 sm:p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 active:scale-95 transition" aria-label="Toggle Theme">
            <span class="dark:hidden text-sm sm:text-base">🌙</span>
            <span class="hidden dark:inline text-sm sm:text-base">☀️</span>
          </button>

          <div id="auth-nav" class="hidden sm:block"></div>

          <!-- Mobile Menu Toggle Button -->
          <button id="mobile-menu-btn" onclick="toggleMobileMenu()" class="md:hidden p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 focus:outline-none active:scale-95 transition" aria-label="Open Menu">
            <svg id="menu-icon-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            <svg id="menu-icon-close" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      </header>
    </div>

    <!-- Mobile Drawer Menu (Slide-down) -->
    <div id="mobile-menu" class="fixed inset-x-4 top-20 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border border-slate-200 dark:border-slate-800 rounded-2xl p-6 z-40 hidden md:hidden shadow-2xl transition-all duration-300">
      <nav class="flex flex-col gap-4 text-base font-semibold text-slate-700 dark:text-slate-200">
        <a href="index.html" onclick="toggleMobileMenu()" class="py-2 border-b border-slate-100 dark:border-slate-800 hover:text-blue-600 dark:hover:text-blue-400">Beranda</a>
        <a href="eksplor.html" onclick="toggleMobileMenu()" class="py-2 border-b border-slate-100 dark:border-slate-800 hover:text-blue-600 dark:hover:text-blue-400">Eksplor</a>
        <!-- <a href="riwayat.html" onclick="toggleMobileMenu()" class="py-2 border-b border-slate-100 dark:border-slate-800 hover:text-blue-600 dark:hover:text-blue-400">Riwayat</a> -->
        <a href="infokomun.html" onclick="toggleMobileMenu()" class="py-2 border-b border-slate-100 dark:border-slate-800 text-blue-600 dark:text-blue-400">Komunitas</a>
        <a href="profil.html" onclick="toggleMobileMenu()" class="py-2 hover:text-blue-600 dark:hover:text-blue-400">Profil</a>

        <div class="pt-4 border-t border-slate-200 dark:border-slate-800 flex flex-col gap-3">
          <a href="eksplor.html" class="w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition"> Masuk SSO Kampus </a>
        </div>
      </nav>
    </div>

    <!-- Content Info/Komun -->
    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 py-8 w-full">
      <!-- Header Page -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">Info Kampus & Direktori Komunitas</h1>
          <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">Rekomendasi tempat makan murah, laundry, toko cetak, dan promo kantong mahasiswa.</p>
        </div>
        <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs sm:text-sm px-4 py-2.5 rounded-xl shadow-md transition flex items-center justify-center gap-2 active:scale-95">
          <span>+ Bagikan Rekomendasi</span>
        </button>
      </div>

      <!-- Filter Kategori (Header Navigation for Categories) -->
      <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-6 no-scrollbar" id="category-filter-container">
        <button onclick="filterCategory('all')" class="cat-btn px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition bg-blue-600 text-white shadow-sm" data-cat="all">✨ Semua Info</button>
        <button
          onclick="filterCategory('kuliner')"
          class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:border-blue-500"
          data-cat="kuliner"
        >
          🍛 Kuliner Hemat
        </button>
        <button
          onclick="filterCategory('cetak')"
          class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:border-blue-500"
          data-cat="cetak"
        >
          🖨️ Cetak & Banner
        </button>
        <button
          onclick="filterCategory('laundry')"
          class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:border-blue-500"
          data-cat="laundry"
        >
          🧺 Laundry & Kost
        </button>
        <button
          onclick="filterCategory('promo')"
          class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:border-blue-500"
          data-cat="promo"
        >
          🎟️ Promo KTM Kampus
        </button>
      </div>

      <!-- Grid Cards Info Komunitas -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5" id="info-cards-grid">
        <!-- Diisi secara dinamis melalui JavaScript -->
      </div>
    </main>

    <!-- MODAL FULL DETAIL INFO KOMUNITAS -->
    <div id="info-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden transition-opacity">
      <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-xl w-full p-6 sm:p-7 border border-slate-200 dark:border-slate-700 shadow-2xl relative max-h-[90vh] overflow-y-auto">
        <!-- Close Button -->
        <button onclick="closeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xl font-bold p-1 rounded-lg">✕</button>

        <!-- Badge Kategori -->
        <div id="modal-category-badge" class="mb-3"></div>

        <!-- Judul & Lokasi -->
        <h2 id="modal-title" class="text-xl font-extrabold text-slate-900 dark:text-white mb-2"></h2>
        <p id="modal-location" class="text-xs text-blue-600 dark:text-blue-400 font-semibold mb-4 flex items-center gap-1"></p>

        <!-- Informasi Kreator/Pengunggah -->
        <div class="flex items-center gap-3 p-3 bg-slate-50 dark:bg-slate-700/50 rounded-2xl mb-4 border border-slate-100 dark:border-slate-700">
          <div id="modal-avatar" class="w-10 h-10 rounded-full text-white font-bold text-sm flex items-center justify-center shadow-sm"></div>
          <div>
            <p id="modal-author" class="font-bold text-xs sm:text-sm text-slate-900 dark:text-white leading-tight"></p>
            <p id="modal-author-info" class="text-[11px] text-slate-400"></p>
          </div>
        </div>

        <!-- Deskripsi Lengkap -->
        <p id="modal-description" class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed mb-6"></p>

        <!-- Section Likes & Diskusikan -->
        <div class="flex items-center justify-between py-3 border-y border-slate-100 dark:border-slate-700 mb-5">
          <button
            id="modal-like-btn"
            onclick="toggleLike()"
            class="flex items-center gap-2 text-xs font-semibold px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-700/80 text-slate-600 dark:text-slate-300 hover:bg-rose-50 hover:text-rose-600 dark:hover:bg-rose-950/40 dark:hover:text-rose-400 transition active:scale-95"
          >
            <span id="modal-like-icon">❤️</span>
            <span id="modal-like-count">0 Suka</span>
          </button>
          <span id="modal-liked-by" class="text-[10px] text-slate-400"></span>
        </div>

        <!-- Section Komentar -->
        <div>
          <h3 class="font-bold text-xs sm:text-sm text-slate-900 dark:text-white mb-3 flex items-center gap-1.5">
            <span>💬 Komentar & Diskusi</span>
            <span id="modal-comment-count" class="text-[10px] px-2 py-0.5 bg-blue-100 dark:bg-blue-950 text-blue-600 dark:text-blue-400 rounded-full font-extrabold"></span>
          </h3>

          <!-- Form Tambah Komentar -->
          <div class="flex gap-2 mb-4">
            <input
              type="text"
              id="comment-input"
              placeholder="Tulis tanggapan atau pertanyaan..."
              class="flex-grow text-xs px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 dark:bg-slate-700 text-slate-800 dark:text-slate-100 outline-none focus:ring-2 focus:ring-blue-500"
            />
            <button onclick="addComment()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs px-4 py-2.5 rounded-xl transition active:scale-95">Kirim</button>
          </div>

          <!-- Daftar Komentar -->
          <div id="modal-comments-list" class="space-y-2.5 max-h-48 overflow-y-auto pr-1 no-scrollbar">
            <!-- Komentar diisi secara dinamis -->
          </div>
        </div>
      </div>
    </div>

    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 bg-white dark:bg-slate-900">
      <div class="max-w-6xl mx-auto px-4 text-xs text-center text-slate-500 dark:text-slate-400">&copy; 2026 TemanBeli. Built for Closed Campus Ecosystem.</div>
    </footer>

    <!-- External JS Dependencies -->
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/navbar.js"></script>

    <!-- Script Khusus Halaman Info/Komun -->
    <script>
      // Mobile Drawer Navigation Toggle
      function toggleMobileMenu() {
        const menu = document.getElementById("mobile-menu");
        const iconOpen = document.getElementById("menu-icon-open");
        const iconClose = document.getElementById("menu-icon-close");

        menu.classList.toggle("hidden");
        iconOpen.classList.toggle("hidden");
        iconClose.classList.toggle("hidden");
      }

      // Dynamic Header Morph
      const headerWrapper = document.getElementById("header-wrapper");
      const mainHeader = document.getElementById("main-header");

      window.addEventListener("scroll", () => {
        if (window.scrollY > 30) {
          // Saat di-scroll ke bawah: Padding atas mengecil
          headerWrapper.classList.remove("pt-4", "sm:pt-5");
          headerWrapper.classList.add("pt-2");

          mainHeader.classList.remove("max-w-6xl");
          mainHeader.classList.add("max-w-4xl", "shadow-md", "h-14");
        } else {
          // Saat kembali ke paling atas: Kembali ke padding awal yang lega
          headerWrapper.classList.remove("pt-2");
          headerWrapper.classList.add("pt-4", "sm:pt-5");

          mainHeader.classList.add("max-w-6xl");
          mainHeader.classList.remove("max-w-4xl", "shadow-md", "h-14");
        }
      });
      // Mock Data Info Komunitas
      const mockInfoData = [
        {
          id: "INF-101",
          judul: "Warung Makan Pak Di",
          kategoriKey: "kuliner",
          kategoriLabel: "Kuliner Hemat",
          icon: "🍛",
          badgeBg: "bg-emerald-100 dark:bg-emerald-950/80 text-emerald-700 dark:text-emerald-400",
          lokasi: "📍 Belakang Fakultas Teknik (Dekat Pos 2)",
          ringkasan: "Nasi + sayur sepuasnya cuma Rp 8.000! Cocok banget buat tanggal tua.",
          deskripsiLengkap: "Warung Makan Pak Di menyediakan menu makan prasmanan khusus mahasiswa. Cukup bayar Rp 8.000 sudah dapet Nasi Sepuasnya, Sayur Bebas Pilih, Lauk Tahu/Tempe, plus Es Teh Gratis kalau tunjukkan KTM!",
          author: "Rian F.",
          authorInfo: "Teknik Elektro &bull; ⭐ 5.0",
          avatarBg: "bg-indigo-600",
          avatarLetter: "R",
          likes: 18,
          likedByText: "Disukai oleh Amelia S. dan 17 lainnya",
          comments: [
            { author: "Amelia S.", text: "Es teh gratisnya beneran masih berlaku kan kak?", date: "2 jam lalu" },
            { author: "Dinda A.", text: "Sambal ijonya mantap banget di sini!", date: "1 jam lalu" },
          ],
        },
        {
          id: "INF-102",
          judul: "Cetak Express 24 Jam",
          kategoriKey: "cetak",
          kategoriLabel: "Cetak & Banner",
          icon: "🖨️",
          badgeBg: "bg-blue-100 dark:bg-blue-950/80 text-blue-700 dark:text-blue-400",
          lokasi: "📍 Depan Gerbang Utama Kampus",
          ringkasan: "Diskon 10% cetak skripsi/banner kalau tunjukkan KTM aktif.",
          deskripsiLengkap: "Tempat cetak langganan anak organisasi dan mahasiswa akhir. Buka 24 jam nonstop, hasil cetak jilid super rapi, dan ada potongan harga khusus 10% untuk pengerjaan banner acara kampus.",
          author: "Dinda A.",
          authorInfo: "Desain Komunikasi Visual &bull; ⭐ 4.9",
          avatarBg: "bg-emerald-600",
          avatarLetter: "D",
          likes: 12,
          likedByText: "Disukai oleh Rian F. dan 11 lainnya",
          comments: [{ author: "Bagus T.", text: "Bisa kirim file lewat WA dulu ga ya sebelum datang?", date: "Yesterday" }],
        },
        {
          id: "INF-103",
          judul: "Kilat Laundry Mahasiswa",
          kategoriKey: "laundry",
          kategoriLabel: "Laundry & Kost",
          icon: "🧺",
          badgeBg: "bg-indigo-100 dark:bg-indigo-950/80 text-indigo-700 dark:text-indigo-400",
          lokasi: "📍 Gang Belakang Perpustakaan Pusat",
          ringkasan: "Rp 5.000 / kg. Antar jemput gratis khusus area kost sekitar kampus.",
          deskripsiLengkap: "Jasa cuci kilat pakaian mahasiswa. Hasil wangi tahan lama, lipatan rapi, dan minimal cuci cuma 2 kg sudah dapet layanan free antar-jemput langsung ke depan pagar kost.",
          author: "Amelia S.",
          authorInfo: "Informatika UNS &bull; ⭐ 4.9",
          avatarBg: "bg-blue-600",
          avatarLetter: "A",
          likes: 24,
          likedByText: "Disukai oleh Rian F., Dinda A., dan 22 lainnya",
          comments: [{ author: "Siti K.", text: "Pengerjaan berapa hari kalau regular kak?", date: "3 hari lalu" }],
        },
        {
          id: "INF-104",
          judul: "Promo Kopi Kampus - Beli 1 Gratis 1",
          kategoriKey: "promo",
          kategoriLabel: "Promo KTM Kampus",
          icon: "☕",
          badgeBg: "bg-amber-100 dark:bg-amber-950/80 text-amber-700 dark:text-amber-400",
          lokasi: "📍 Kantin Pusat FITDS",
          ringkasan: "Khusus hari Senin-Rabu jam 13.00 - 16.00 tunjukkan KTM UNS.",
          deskripsiLengkap: "Promo khusus mahasiswa aktif! Beli varian kopi susu aren ukuran besar gratis 1 kopi hitam cold brew. Cukup tunjukkan fisik KTM atau kartu mahasiswa digital di aplikasi.",
          author: "Fikri K.",
          authorInfo: "Sains Data &bull; ⭐ 4.8",
          avatarBg: "bg-amber-600",
          avatarLetter: "F",
          likes: 31,
          likedByText: "Disukai oleh 31 mahasiswa",
          comments: [],
        },
      ];

      let currentActiveInfo = null;
      let currentFilter = "all";

      // Render Cards
      function renderInfoCards() {
        const grid = document.getElementById("info-cards-grid");
        if (!grid) return;

        const filtered = currentFilter === "all" ? mockInfoData : mockInfoData.filter((item) => item.kategoriKey === currentFilter);

        grid.innerHTML = filtered
          .map(
            (item) => `
        <div onclick="openModal('${item.id}')" class="p-5 bg-white dark:bg-slate-800 rounded-2xl sm:rounded-3xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm hover:shadow-md hover:border-blue-500/50 transition cursor-pointer flex flex-col justify-between group active:scale-98">
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-2xl">${item.icon}</span>
              <span class="px-2.5 py-1 ${item.badgeBg} text-[10px] font-bold rounded-lg">${item.kategoriLabel}</span>
            </div>
            <h3 class="font-bold text-sm sm:text-base text-slate-900 dark:text-white mb-1 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition">${item.judul}</h3>
            <p class="text-[11px] text-blue-600 dark:text-blue-400 font-semibold mb-2">${item.lokasi}</p>
            <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed mb-4 line-clamp-2">${item.ringkasan}</p>
          </div>
          
          <div class="pt-3 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between text-[11px] text-slate-400">
            <span class="flex items-center gap-1.5 font-medium text-slate-700 dark:text-slate-300">
              <span class="w-5 h-5 rounded-full ${item.avatarBg} text-white font-bold text-[9px] flex items-center justify-center">${item.avatarLetter}</span>
              <span>${item.author}</span>
            </span>
            <span class="flex items-center gap-2">
              <span>❤️ ${item.likes}</span>
              <span>💬 ${item.comments.length}</span>
            </span>
          </div>
        </div>
      `,
          )
          .join("");
      }

      // Filter Function
      function filterCategory(categoryKey) {
        currentFilter = categoryKey;

        // Update Button Styles
        document.querySelectorAll(".cat-btn").forEach((btn) => {
          if (btn.getAttribute("data-cat") === categoryKey) {
            btn.className = "cat-btn px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition bg-blue-600 text-white shadow-sm";
          } else {
            btn.className = "cat-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:border-blue-500";
          }
        });

        renderInfoCards();
      }

      // Modal Functions
      function openModal(id) {
        currentActiveInfo = mockInfoData.find((item) => item.id === id);
        if (!currentActiveInfo) return;

        document.getElementById("modal-title").innerText = currentActiveInfo.judul;
        document.getElementById("modal-location").innerText = currentActiveInfo.lokasi;
        document.getElementById("modal-description").innerText = currentActiveInfo.deskripsiLengkap;
        document.getElementById("modal-author").innerText = currentActiveInfo.author;
        document.getElementById("modal-author-info").innerHTML = currentActiveInfo.authorInfo;
        document.getElementById("modal-like-count").innerText = `${currentActiveInfo.likes} Suka`;
        document.getElementById("modal-liked-by").innerText = currentActiveInfo.likedByText;

        // Avatar
        const avatarEl = document.getElementById("modal-avatar");
        avatarEl.className = `w-10 h-10 rounded-full text-white font-bold text-sm flex items-center justify-center shadow-sm ${currentActiveInfo.avatarBg}`;
        avatarEl.innerText = currentActiveInfo.avatarLetter;

        // Category Badge
        document.getElementById("modal-category-badge").innerHTML = `<span class="px-3 py-1 ${currentActiveInfo.badgeBg} text-xs font-bold rounded-lg inline-block">${currentActiveInfo.icon} ${currentActiveInfo.kategoriLabel}</span>`;

        renderComments();

        document.getElementById("info-modal").classList.remove("hidden");
        document.body.style.overflow = "hidden"; // Stop background scroll
      }

      function closeModal() {
        document.getElementById("info-modal").classList.add("hidden");
        document.body.style.overflow = "auto";
      }

      function renderComments() {
        if (!currentActiveInfo) return;

        const container = document.getElementById("modal-comments-list");
        const countEl = document.getElementById("modal-comment-count");

        countEl.innerText = currentActiveInfo.comments.length;

        if (currentActiveInfo.comments.length === 0) {
          container.innerHTML = `<p class="text-xs text-slate-400 italic py-2">Belum ada komentar. Jadi yang pertama menanggapi!</p>`;
          return;
        }

        container.innerHTML = currentActiveInfo.comments
          .map(
            (c) => `
        <div class="p-3 bg-slate-50 dark:bg-slate-700/50 rounded-xl border border-slate-100 dark:border-slate-700/80">
          <div class="flex items-center justify-between mb-1">
            <span class="font-bold text-xs text-slate-900 dark:text-white">${c.author}</span>
            <span class="text-[10px] text-slate-400">${c.date}</span>
          </div>
          <p class="text-xs text-slate-600 dark:text-slate-300 leading-normal">${c.text}</p>
        </div>
      `,
          )
          .join("");
      }

      function addComment() {
        const input = document.getElementById("comment-input");
        const text = input.value.trim();
        if (!text || !currentActiveInfo) return;

        currentActiveInfo.comments.push({
          author: "Amelia S.", // Current User
          text: text,
          date: "Baru saja",
        });

        input.value = "";
        renderComments();
        renderInfoCards(); // Update count on cards
      }

      function toggleLike() {
        if (!currentActiveInfo) return;
        currentActiveInfo.likes += 1;
        document.getElementById("modal-like-count").innerText = `${currentActiveInfo.likes} Suka`;
        renderInfoCards();
      }

      // Init Render
      document.addEventListener("DOMContentLoaded", () => {
        renderInfoCards();
      });
    </script>
  </body>
</html>
